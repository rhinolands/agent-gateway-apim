name: validate

# Gate every change. Nothing merges/publishes unless all gates pass.
# Gate 3 scans every commit for secrets (gitleaks).
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  terraform:
    name: Gate 1 — fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false
      - name: validate
        run: terraform validate -no-color

  security:
    name: Gate 2 — security scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infra

  gitleaks:
    name: Gate 3 — secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner --log-opts="--all"
